<script>
"use strict";
/* =====================================================================
   GestionÉcole — application du téléphone (espace du maître), version 1.0
   Conçue par DSOB. Lit les fichiers « Classe_… .classe » du logiciel de
   l'ordinateur et fabrique les fichiers « Notes_… .notes » qu'il reçoit.
   Tout reste dans le téléphone ; rien ne part sur Internet.
   ===================================================================== */
const NOM_LOGICIEL = "GestionEcoleExamEvaluations", AUTEUR = "DSOB";
const CLE_PUBLIQUE_DSOB = "hhwB2NkqOBWGfXeTgMt73TCqmBrzvLqrACvQU0NFlb4=";
const ESSAI_JOURS = 7, MOIS_ACTIVATION = 9, ESSAIS_MAX = 5, DUREE_BLOCAGE = 120, ITERATIONS = 300000;
const MATIERES_ELEMENTAIRE = [
  {nom: "Langue et communication", parties: [["Ressources", 40], ["Compétences", 60]]},
  {nom: "Mathématiques", parties: [["Ressources", 40], ["Compétences", 60]]},
  {nom: "Découverte du monde", parties: [["Ressources", 24], ["Compétences", 16]]},
  {nom: "Éducation au développement durable", parties: [["Ressources", 24], ["Compétences", 16]]},
  {nom: "Éducation artistique", parties: [["Note", 10]]},
  {nom: "Éducation musicale", parties: [["Note", 10]]},
  {nom: "Arabe", parties: [["Note", 10]]},
  {nom: "Anglais", parties: [["Note", 10]]}];

/* ---------- 1. JSON qui garde l'écriture exacte des nombres (12.0 reste 12.0, comme dans Python) ---------- */
class Num { constructor(t) { this.t = String(t); } valueOf() { return parseFloat(this.t); } toString() { return this.t; } }
function parseJ(txt) {

  function val() {
    blanc(); const c = txt[i];
    if (c === "{") { i++; const o = {}; blanc(); if (txt[i] === "}") { i++; return o; }
      for (;;) { blanc(); const k = chaine(); blanc(); i++; o[k] = val(); blanc(); if (txt[i] === ",") { i++; continue; } i++; return o; } }
    if (c === "[") { i++; const a = []; blanc(); if (txt[i] === "]") { i++; return a; }
      for (;;) { a.push(val()); blanc(); if (txt[i] === ",") { i++; continue; } i++; return a; } }
    if (c === '"') return chaine();
    if (txt.startsWith("true", i)) { i += 4; return true; }
    if (txt.startsWith("false", i)) { i += 5; return false; }
    if (txt.startsWith("null", i)) { i += 4; return null; }
    if (txt.startsWith("NaN", i)) { i += 3; return null; }
    const m = /^-?(?:Infinity|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/.exec(txt.slice(i, i + 40));

function strJ(v) {

  if (typeof v === "string" || typeof v === "boolean") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(strJ).join(", ") + "]";
  return "{" + Object.keys(v).map(k => JSON.stringify(k) + ": " + strJ(v[k])).join(", ") + "}";

const copieJ = v => parseJ(strJ(v));

  return Number.isInteger(x) ? x.toFixed(1) : String(x);

/* ---------- 2. Base64 et octets ---------- */

/* ---------- 3. Fernet (le même chiffrement que le logiciel de l'ordinateur) ---------- */
async function fernetCles(cle) {

          chif: await crypto.subtle.importKey("raw", o.slice(16, 32), {name: "AES-CBC"}, false, ["encrypt", "decrypt"])};
}

  const k = await fernetCles(cle), o = b64enOctets(jeton.trim());
  if (o[0] !== 0x80 || o.length < 57) throw new Error("jeton");
  const corps = o.slice(0, o.length - 32), mac = o.slice(o.length - 32);
  const calcule = new Uint8Array(await crypto.subtle.sign("HMAC", k.sig, corps));
  if (!egaux(calcule, mac)) throw new Error("mauvaise clé");
  return new Uint8Array(await crypto.subtle.decrypt({name: "AES-CBC", iv: o.slice(9, 25)}, k.chif, o.slice(25, o.length - 32)));

async function fernetChiffrer(cle, donnees) {
  const k = await fernetCles(cle), iv = crypto.getRandomValues(new Uint8Array(16));
  const t = Math.floor(Date.now() / 1000), ts = new Uint8Array(8);
  for (let n = 7, v = t; n >= 0; n--, v = Math.floor(v / 256)) ts[n] = v % 256;

async function cleDepuisCode(code, sel) {     // PBKDF2-SHA256, 300 000 tours, comme cle_depuis_code
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  const brut = new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: sel, iterations: ITERATIONS}, base, 256));

/* ---------- 4. Ed25519 : vérifier qu'une licence a bien été fabriquée par DSOB ---------- */
const ED = (() => {

  try { return await ED.verifie(b64enOctets(CLE_PUBLIQUE_DSOB), lue.sig, msg); } catch (e) { return false; }

/* ---------- 5. Mémoire du téléphone ---------- */
const CLE_MEMOIRE = "gestionecole_telephone_v1";

  catch (e) { alerte("Impossible d'enregistrer dans le téléphone (mémoire pleine ?)."); return false; } }
function codeTelephone() {
  if (!M.code_tel) {
    const r = crypto.getRandomValues(new Uint8Array(12));
    let t = ""; for (const x of r) t += "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"[x % 32];
    M.code_tel = t.slice(0, 4) + "-" + t.slice(4, 8) + "-" + t.slice(8, 12); garderMemoire();

/* ---------- 6. Licence : c'est l'école qui paie. Sa licence arrive dans le fichier de la classe. ---------- */
let LIC = {statut: "essai"};
async function licenceEcoleLue(lic) {      // {texte, ordinateur} : signée par DSOB pour l'ordinateur de l'école
  if (!lic || typeof lic !== "object") return null;
  const lue = lireTexteLicence(String(lic.texte || ""));
  if (!lue || lue.genre !== "ecole") return null;
  return (await licenceAuthentique(lue, String(lic.ordinateur || ""))) ? lue : null;

async function verifierLicence() {
  const maintenant = Date.now();

  if (M.horloge && maintenant < M.horloge - 86400000) { LIC = {statut: "horloge"}; return LIC; }

  const lue = ecole || (ancienne && ancienne.genre === "maitre" && await licenceAuthentique(ancienne, codeTelephone()) ? ancienne : null);

function texteLicence() {
  switch (LIC.statut) {
    case "valide": return (LIC.ecole ? "Licence de l'école " : "Licence ") + LIC.annee + " : valable jusqu'au " + dateFr(LIC.fin) + " (" + LIC.jours + " jour(s))."
                      + (LIC.ecole ? " Votre école l'a payée : vous n'avez rien à payer." : "");
    case "essai": return "Essai gratuit : encore " + LIC.jours + " jour" + (LIC.jours > 1 ? "s" : "") + " (jusqu'au " + dateFr(LIC.fin) + ").";

let S = null;          // session ouverte : {donnees, cle, sel, code}
let erreursCode = 0, bloqueJusqua = 0;
async function ouvrirAvecCode(contenu, code) {
  const id = code.split("-")[0];
  for (const serrure of (contenu.acces || [])) {
    if (serrure.id !== id) continue;
    try {
      const cleProf = await cleDepuisCode(code, b64enOctets(serrure.sel));
      const cle = dec.decode(await fernetDechiffrer(cleProf, serrure.cle));
      const donnees = parseJ(dec.decode(await fernetDechiffrer(cle, contenu.donnees)));
      return {donnees, cle, sel: contenu.sel};
    } catch (e) { /* mauvais code */ }
  }
  return null;
}
async function garderClasse() {          // les données restent chiffrées dans le téléphone
  M.classe.donnees = await fernetChiffrer(S.cle, enc.encode(strJ(S.donnees)));
  return garderMemoire();
}
function copieMaitre(d) { return ((d || {}).synchro || {}).copie_maitre || {}; }
function nomsClasses() { return (copieMaitre(S.donnees).classes || []).filter(n => S.donnees.classes && S.donnees.classes[n]); }
function matieresEnDicts(liste) {
  const r = [];
  for (const m of (liste || [])) {
    if (typeof m === "string") { const o = MATIERES_ELEMENTAIRE.find(x => x.nom === m); if (o) r.push({nom: m, parties: o.parties}); }
    else r.push(m);
  }
  return r;
}
const maxiPartie = p => (Array.isArray(p) && p.length > 1) ? parseFloat(p[1]) : NaN;
const baremeIncomplet = m => !m.parties || !m.parties.length || m.parties.some(p => !(maxiPartie(p) > 0));
function matiereComplete(compo, classe, m) {
  const els = classe.eleves || []; if (!els.length) return false;
  return els.every(el => (((compo.notes || {})[el.id] || {})[m.nom] || []).length === m.parties.length);
}
// Toutes les notes de la classe : {"classe|composition|élève|activité": texte exact}
function toutesLesNotes(d) {
  const r = {};
  for (const n of (copieMaitre(d).classes || [])) {
    const c = (d.classes || {})[n]; if (!c) continue;
    for (const [cle, compo] of Object.entries(c.compositions || {}))
      for (const [el, ns] of Object.entries((compo || {}).notes || {}))
        for (const [mat, v] of Object.entries(ns || {})) r[c.id + "|" + cle + "|" + el + "|" + mat] = strJ(v);
    for (const el of (c.eleves || [])) if (el && el.id) r[c.id + "|ELEVE:|" + el.id + "|"] = strJ(el);
    for (const [cle, sem] of Object.entries(c.semestres || {}))
      for (const [el, ns] of Object.entries((sem || {}).notes || {}))
        for (const [mat, v] of Object.entries(ns || {})) r[c.id + "|SEM:" + cle + "|" + el + "|" + mat] = strJ(v);
  }
  return r;
}
// Mise à jour : la classe du directeur, mais on garde les notes tapées ici et pas encore envoyées
function garderNotesNonEnvoyees(ancienne, nouvelle) {
  const L = toutesLesNotes(ancienne), N = toutesLesNotes(nouvelle);
  const envoye = (ancienne.synchro || {}).envoye_tel || {};
  const parId = {}; for (const [n, c] of Object.entries(nouvelle.classes || {})) if (c && c.id) parId[c.id] = c;
  const lecture = {}; for (const n of Object.keys(ancienne.classes || {})) { const c = ancienne.classes[n]; if (c && c.id) lecture[c.id] = c; }
  let gardes = 0;
  for (const k of new Set([...Object.keys(L), ...Object.keys(N)])) {
    if (L[k] === N[k]) continue;
    if (!(k in L) && !(k in N)) continue;
    if (L[k] === envoye[k]) continue;            // le directeur a déjà eu cette note : sa décision compte
    if (!(k in L)) continue;
    const [cid, cle, el, mat] = k.split("|"), dest = parId[cid], src = lecture[cid];
    if (!dest || !src) continue;
    if (cle === "ELEVE:") {                          // étape 254 : élève tapé ou corrigé ici, pas encore envoyé
      const local = (src.eleves || []).find(x => x && x.id === el); if (!local) continue;
      dest.eleves = dest.eleves || [];
      const i = dest.eleves.findIndex(x => x && x.id === el);
      if (i >= 0) dest.eleves[i] = Object.assign({}, dest.eleves[i], copieJ(local)); else dest.eleves.push(copieJ(local));
      gardes++; continue;
    }
    if (cle.startsWith("SEM:")) {                      // collège / lycée : note d'un semestre
      const sc = cle.slice(4); dest.semestres = dest.semestres || {};
      const sem = (dest.semestres[sc] = dest.semestres[sc] || {notes: {}, assiduite: {}}); sem.notes = sem.notes || {};
      (sem.notes[el] = sem.notes[el] || {})[mat] = copieJ(src.semestres[sc].notes[el][mat]);
      gardes++; continue;
    }
    dest.compositions = dest.compositions || {};
    if (!dest.compositions[cle]) {
      const meta = copieJ(src.compositions[cle]); meta.notes = {}; dest.compositions[cle] = meta;
    }
    const notes = (dest.compositions[cle].notes = dest.compositions[cle].notes || {});
    (notes[el] = notes[el] || {})[mat] = copieJ(src.compositions[cle].notes[el][mat]);
    gardes++;
  }
  nouvelle.synchro = nouvelle.synchro || {};
  if (ancienne.synchro && ancienne.synchro.envoye_tel) nouvelle.synchro.envoye_tel = ancienne.synchro.envoye_tel;
  if (ancienne.synchro && ancienne.synchro.dernier_envoi) nouvelle.synchro.dernier_envoi = ancienne.synchro.dernier_envoi;
  return gardes;
}

function normaliserCode(t) {

// Installe (ou met à jour) la classe contenue dans un fichier reçu du directeur.
async function importerContenu(contenu, code) {
  attente(true, "Vérification du code…\n(quelques secondes)");
  let ouvert = null; try { ouvert = await ouvrirAvecCode(contenu, code); } catch (e) {}
  attente(false);
  if (!ouvert) return {ok: false, code: true};
  const cm = copieMaitre(ouvert.donnees);
  if (!cm.code || cm.code !== code.slice(0, 3)) return {ok: false, texte: "Ce fichier n'est pas un fichier de classe préparé pour vous par le directeur."};
  const mise_a_jour = !!M.classe;
  let gardes = 0;
  if (mise_a_jour) {
    if (!S || S.code !== code) {
      if (!(await ouvrirClasse(code)))
        return {ok: false, texte: "Une autre classe est déjà sur ce téléphone, avec un autre code. Tapez le code de cette classe-là pour la mettre à jour."};
    }
    const avant = copieMaitre(S.donnees).exportee_le;
    if (cm.exportee_le && avant && +cm.exportee_le < +avant &&
        !confirm("Ce fichier est PLUS ANCIEN que celui déjà installé. L'installer quand même ?")) return {ok: false, texte: "Rien n'a été changé."};
    gardes = garderNotesNonEnvoyees(S.donnees, ouvert.donnees);
  }
  S = {donnees: ouvert.donnees, cle: ouvert.cle, sel: ouvert.sel, code};
  M.classe = {fichier: {format: contenu.format, sel: contenu.sel, donnees: contenu.donnees, acces: contenu.acces}, donnees: ""};
  if (await licenceEcoleLue(ouvert.donnees.licence_ecole)) M.licence_ecole = copieJ(ouvert.donnees.licence_ecole);
  if (!(await garderClasse())) return {ok: false, texte: "Impossible d'enregistrer dans le téléphone."};
  await verifierLicence();
  return {ok: true, message: '<div class="message ok">✓ Classe ' + (mise_a_jour ? "mise à jour" : "installée") + " sur ce téléphone."
    + (gardes ? "<br>" + gardes + " note(s) ou élève(s) tapé(s) ici et pas encore envoyé(s) ont été gardé(s)." : "") + "</div>"};
}
function compterErreurCode(msg) {

    return msg("Code incorrect. Trop d'erreurs : attendez " + DUREE_BLOCAGE + " secondes."); }

  $("b-compos").onclick = () => estProf() ? ecranProfClasses() : ecranCompositions(); $("b-eleves").onclick = ecranEleves;
  if ($("b-repartition")) $("b-repartition").onclick = () => ecranRepartition();

      + (maitre ? '<span class="p ' + (el.inscription === "Payée" ? "ok" : "non") + '">' + (el.inscription === "Payée" ? "Payée" : "Non payée") + "</span>" : "") + "</button>");

}

/* ---------- Étape 254 : la fiche d'un élève, en deux pages (maquette 2 du 04/11/2026) ---------- */
const majMots = t => String(t || "").trim().replace(/\s+/g, " ").toLowerCase().replace(/(^|[\s\-'’])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const simple = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
const nomValable = t => /^[\p{L}][\p{L} '’\-.]*$/u.test(t);
function dateValable(t) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t); if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return (d.getDate() === +m[1] && d.getMonth() === +m[2] - 1) ? d : null;
}
function periodeInscriptions() {
  const p = +anneeScolaire().slice(0, 4); return [new Date(p, 9, 1), new Date(p + 1, 5, 30)];
}
function estCI(nomClasse) { return /^CI\b/.test(nomClasse); }
function nouvelId() { const r = crypto.getRandomValues(new Uint8Array(6)); return [...r].map(x => x.toString(16).padStart(2, "0")).join(""); }
let ficheEnCours = null;            // {nomClasse, index, page, v:{…}, ouvert}
function ecranFicheEleve(nomClasse, index, page, message) {
  const classe = S.donnees.classes[nomClasse], els = classe.eleves || [];
  if (!ficheEnCours || ficheEnCours.nomClasse !== nomClasse || ficheEnCours.index !== index) {
    const el = index >= 0 ? els[index] : {};
    ficheEnCours = {nomClasse, index, ouvert: index < 0, v: {
      prenom: el.prenom || "", nom: el.nom || "", sexe: el.sexe || "", statut: el.statut || "",
      scolarite: el.scolarite !== undefined && el.scolarite !== null ? String(el.scolarite) : "",
      doublees: el.doublees !== undefined && el.doublees !== null ? String(el.doublees) : (index < 0 ? "0" : ""),
      inscription: el.inscription || "", date: el.date || "", lieu: el.lieu || "",
      reg_numero: el.reg_numero || "", reg_annee: el.reg_annee || "", reg_centre: el.reg_centre || ""}};
    ficheEnCours.depart = JSON.stringify(ficheEnCours.v);
  }
  const F = ficheEnCours, v = F.v, nouveau = index < 0, dis = F.ouvert ? "" : " disabled";
  const statuts = estCI(nomClasse) ? ["Nouveau", "Redoublant"] : ["Passant", "Redoublant"];
  const choix = (cle, options) => '<div class="choix">' + options.map(o => '<button data-ch="' + cle + '" data-v="' + esc(o) + '" class="'
                + (v[cle] === o ? "on" : "") + '"' + dis + ">" + esc(o) + "</button>").join("") + "</div>";
  const champ = (cle, lib, mode, ph) => '<label class="t">' + lib + '</label><input type="text" data-f="' + cle + '" value="' + esc(v[cle])
                + '" autocomplete="off"' + (mode ? ' inputmode="' + mode + '"' : "") + (ph ? ' placeholder="' + ph + '"' : "") + dis + ">";
  let html = (message || "") + (peutTaper() ? "" : bandeauLicence())
    + '<div class="etapes"><div class="on"></div><div class="' + (page === 2 ? "on" : "") + '"></div></div><div class="carte fiche">';
  if (page === 1) {
    html += "<h2>1 / 2 · L'élève</h2>" + champ("prenom", "Prénom(s)") + champ("nom", "Nom")
      + '<label class="t">Sexe</label>' + choix("sexe", ["M", "F"])
      + '<label class="t">Statut cette année</label>' + choix("statut", statuts)
      + '<div class="deux"><div>' + champ("scolarite", "Scolarité (années)", "numeric") + "</div><div>" + champ("doublees", "Classes doublées", "numeric") + "</div></div>"
      + '<label class="t">Inscription</label>' + choix("inscription", ["Payée", "Non payée"]);
  } else {
    html += "<h2>2 / 2 · La naissance</h2>" + '<p class="gris">Regardez l\'extrait de naissance. Laissez vide si vous ne l\'avez pas encore.</p>'
      + '<div class="deux"><div>' + champ("date", "Date de naissance", "numeric", "JJ/MM/AAAA") + "</div><div>" + champ("lieu", "Lieu de naissance") + "</div></div>"
      + '<div class="deux"><div>' + champ("reg_numero", "N° dans le registre") + "</div><div>" + champ("reg_annee", "Année du registre", "numeric") + "</div></div>"
      + champ("reg_centre", "Centre d'état civil");
  }
  html += "</div>";
  const barre = !F.ouvert ? '<button class="gros" id="b-modifier">Modifier</button>'
    : (page === 1 ? '<button class="gros" id="b-suite">Suivant : la naissance ›</button>'
                  : '<button class="gros contour" id="b-prec">‹ Page 1</button><button class="gros vert" id="b-enreg">' + (nouveau ? "Enregistrer et élève suivant" : "Enregistrer") + "</button>")
      + '<button class="gros contour" id="b-annuler">Annuler</button>';
  const titre = nouveau ? "Nouvel élève" : (v.prenom + " " + String(v.nom).toUpperCase());
  ecran(titre, nomClasse + " · élève " + (nouveau ? els.length + 1 : index + 1), html, () => { ficheEnCours = null; ecranEleves(); }, barre);
  avantDeQuitter = () => F.ouvert && JSON.stringify(F.v) !== F.depart;
  const lire = () => document.querySelectorAll("[data-f]").forEach(c => v[c.dataset.f] = c.value);
  document.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => { if (!F.ouvert) return; lire(); v[b.dataset.ch] = b.dataset.v; ecranFicheEleve(nomClasse, index, page); });
  document.querySelectorAll("[data-f]").forEach(c => c.oninput = () => v[c.dataset.f] = c.value);
  const erreur = (t, cle) => {
    $("barre-msg").innerHTML = '<div class="message erreur" style="margin:0 0 8px">' + esc(t) + "</div>";
    const c = cle && document.querySelector('[data-f="' + cle + '"]'); if (c) { c.classList.add("faux"); c.focus(); c.scrollIntoView({block: "center"}); }
    return false;
  };
  const verifierPage1 = () => {
    lire(); v.prenom = majMots(v.prenom); v.nom = majMots(v.nom);
    if (!v.prenom || !v.nom) return erreur("Le prénom et le nom de l'élève sont obligatoires.", !v.prenom ? "prenom" : "nom");
    if (!nomValable(v.prenom)) return erreur("Le prénom ne doit contenir que des lettres.", "prenom");
    if (!nomValable(v.nom)) return erreur("Le nom ne doit contenir que des lettres.", "nom");
    if (!v.sexe) return erreur("Choisissez le sexe de l'élève : M ou F.");
    if (!v.statut) return erreur("Choisissez le statut : « " + statuts[0] + " » ou « " + statuts[1] + " » cette année.");
    if (!/^\d+$/.test(v.scolarite.trim()) || +v.scolarite === 0) return erreur("Scolarité : tapez le nombre d'années (ex : 4).", "scolarite");
    if (!/^\d+$/.test(v.doublees.trim())) return erreur("Classes doublées : tapez un nombre entier (0 si aucune).", "doublees");
    if (+v.doublees >= +v.scolarite) return erreur("Classes doublées : le nombre doit être plus petit que la scolarité.", "doublees");
    if (!v.inscription) return erreur("Choisissez l'inscription : Payée ou Non payée.");
    return true;
  };
  const verifierPage2 = () => {
    lire(); v.lieu = majMots(v.lieu); v.date = v.date.trim(); v.reg_numero = v.reg_numero.trim().replace(/\s+/g, " ");
    v.reg_annee = v.reg_annee.trim(); v.reg_centre = v.reg_centre.trim().replace(/\s+/g, " "); v.reg_centre = v.reg_centre.charAt(0).toUpperCase() + v.reg_centre.slice(1);
    if (v.date && !v.lieu) return erreur("Vous avez tapé la date de naissance : tapez aussi le lieu de naissance.", "lieu");
    if (v.lieu && !v.date) return erreur("Vous avez tapé le lieu de naissance : tapez aussi la date de naissance.", "date");
    if (v.lieu && !nomValable(v.lieu)) return erreur("Le lieu de naissance ne doit contenir que des lettres.", "lieu");
    if (!v.date) { if (v.reg_numero || v.reg_annee || v.reg_centre) return erreur("Tapez aussi la date de naissance (le n° dans le registre va avec la date et le lieu).", "date"); return true; }
    const d = dateValable(v.date);
    if (!d) return erreur("Date invalide. Format attendu : JJ/MM/AAAA (ex : 04/11/2017).", "date");
    if (d.getFullYear() < 1990 || d > new Date()) return erreur("Année de naissance impossible pour un élève.", "date");
    const age = +anneeScolaire().slice(0, 4) - d.getFullYear();
    if (age < 3 || age > 25) return erreur("Âge impossible pour un élève de l'école (" + age + " ans à la rentrée). Vérifiez la date.", "date");
    if (+v.scolarite > Math.max(1, age - 4)) return erreur("Scolarité impossible : " + v.scolarite + " années d'école pour un élève de " + age + " ans. Vérifiez la scolarité (page 1) ou la date.", "date");
    if (nouveau) for (const [cle, t] of [["reg_numero", "le n° dans le registre des naissances"], ["reg_annee", "l'année du registre"], ["reg_centre", "le centre d'état civil"]])
      if (!v[cle]) return erreur("Vous avez tapé la date de naissance : tapez aussi " + t + " (regardez l'extrait de naissance).", cle);
    if (v.reg_numero.length > 20) return erreur("Le n° dans le registre est trop long (20 caractères au plus).", "reg_numero");
    if (v.reg_annee && (!/^\d{4}$/.test(v.reg_annee) || +v.reg_annee < d.getFullYear() || +v.reg_annee > new Date().getFullYear()))
      return erreur("Année du registre : 4 chiffres, entre " + d.getFullYear() + " et " + new Date().getFullYear() + ".", "reg_annee");
    if (v.reg_centre.length > 60) return erreur("Le centre d'état civil est trop long (60 caractères au plus).", "reg_centre");
    return true;
  };
  if ($("b-modifier")) $("b-modifier").onclick = () => { if (!peutTaper()) return alerte(texteLicence()); F.ouvert = true; F.depart = JSON.stringify(v); ecranFicheEleve(nomClasse, index, page); };
  if ($("b-annuler")) $("b-annuler").onclick = () => { ficheEnCours = null; avantDeQuitter = null; nouveau ? ecranEleves() : ecranFicheEleve(nomClasse, index, 1); };
  if ($("b-suite")) $("b-suite").onclick = () => { if (verifierPage1()) ecranFicheEleve(nomClasse, index, 2); };
  if ($("b-prec")) $("b-prec").onclick = () => { lire(); ecranFicheEleve(nomClasse, index, 1); };
  if ($("b-enreg")) $("b-enreg").onclick = async () => {
    if (!verifierPage1()) return ecranFicheEleve(nomClasse, index, 1, '<div class="message erreur">Corrigez d\'abord la page 1.</div>');
    if (!verifierPage2()) return;
    const autre = els.find((e, k) => k !== index && simple(e.prenom) === simple(v.prenom) && simple(e.nom) === simple(v.nom) && (e.date || "") === v.date);
    if (autre && !confirm(v.prenom + " " + v.nom.toUpperCase() + (v.date ? " né(e) le " + v.date : "") + " est déjà dans la liste.\n\nL'enregistrer quand même (un autre élève qui porte le même nom) ?")) return;
    const sauvegarde = strJ(classe.eleves || []);
    const el = nouveau ? {id: nouvelId()} : els[index];
    for (const c of ["prenom", "nom", "sexe", "statut", "inscription", "date", "lieu", "reg_numero", "reg_annee", "reg_centre"]) {
      if (v[c]) el[c] = v[c]; else delete el[c];
    }
    el.scolarite = new Num(String(+v.scolarite)); el.doublees = new Num(String(+v.doublees));
    if (el.inscription === "Payée") {
      if (!el.date_paiement) { const [deb, fin] = periodeInscriptions(), j = new Date(Math.min(Math.max(Date.now(), deb), fin));
        el.date_paiement = String(j.getDate()).padStart(2, "0") + "/" + String(j.getMonth() + 1).padStart(2, "0") + "/" + j.getFullYear(); }
    } else el.date_paiement = "";
    if (nouveau) (classe.eleves = classe.eleves || []).push(el);
    classe.eleves.sort((a, b) => (simple(a.nom) + " " + simple(a.prenom)).localeCompare(simple(b.nom) + " " + simple(b.prenom)));
    attente(true, "Enregistrement…"); const ok = await garderClasse(); attente(false);
    if (!ok) { classe.eleves = parseJ(sauvegarde); return; }
    avantDeQuitter = null; ficheEnCours = null;
    const qui = esc(el.prenom + " " + el.nom.toUpperCase());
    if (nouveau) return ecranFicheEleve(nomClasse, -1, 1, '<div class="message ok">✓ ' + qui + " enregistré" + (el.sexe === "F" ? "e" : "")
      + " (" + classe.eleves.length + " élève(s)). Voici la fiche de l'élève suivant.</div>");
    ecranEleves('<div class="message ok">✓ Fiche de ' + qui + " enregistrée.</div>");
  };
}

function ecranCompositions() {
  let html = "";
  for (const n of nomsClasses()) {
    const classe = S.donnees.classes[n], compos = Object.entries(classe.compositions || {});
    html += '<div class="carte"><h2>' + esc(n) + "</h2>";
    if (!compos.length) html += '<p class="gris">Aucune composition. Le directeur la crée sur son ordinateur avec les activités, puis vous renvoie la classe.</p>';
    for (const [cle, compo] of compos.sort()) {
      const ms = matieresEnDicts(compo.matieres), faites = ms.filter(m => !baremeIncomplet(m) && matiereComplete(compo, classe, m)).length;
      html += '<button class="ligne-menu" data-c="' + esc(n) + '" data-k="' + esc(cle) + '"><span class="ic">' + (faites === ms.length && ms.length ? "✅" : "📝")
           + "</span><span>" + esc(cle) + '<span class="ex">' + faites + " / " + ms.length + " activité(s) remplie(s)</span></span></button>";
    }
    html += "</div>";
  }
  ecran("Taper les notes", "Choisissez la composition", html, ecranClasse);
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => ecranActivites(b.dataset.c, b.dataset.k));
}

function ecranActivites(nomClasse, cle, message) {
  const classe = S.donnees.classes[nomClasse], compo = classe.compositions[cle], ms = matieresEnDicts(compo.matieres);
  let html = (message || "") + '<div class="carte"><p class="gris">' + (classe.eleves || []).length + " élève(s). Touchez une activité pour taper ses notes.</p></div>";
  ms.forEach((m, i) => {
    const inc = baremeIncomplet(m), fait = !inc && matiereComplete(compo, classe, m);
    const bareme = inc ? "barème à compléter sur l'ordinateur" : m.parties.map(p => p[0] + " /" + texteNote(p[1])).join(" + ");
    html += '<button class="ligne-menu" data-i="' + i + '"' + (inc ? " disabled" : "") + '><span class="ic">' + (fait ? "✅" : "✏️")
         + "</span><span>" + esc(m.nom) + '<span class="ex">' + esc(bareme) + (fait ? " · notes saisies" : "") + "</span></span></button>";
  });
  ecran(cle, nomClasse, html, ecranCompositions);
  document.querySelectorAll("[data-i]").forEach(b => b.onclick = () => ecranSaisie(nomClasse, cle, +b.dataset.i));
}

function ecranSaisie(nomClasse, cle, index, message) {
  const classe = S.donnees.classes[nomClasse], compo = classe.compositions[cle];
  const ms = matieresEnDicts(compo.matieres), m = ms[index], els = classe.eleves || [];
  compo.notes = compo.notes || {};
  const suiv = ms.findIndex((x, i) => i > index && !baremeIncomplet(x));
  let html = (message || "") + (peutTaper() ? "" : bandeauLicence())
    + '<div class="carte"><h2 style="margin:0 0 4px">' + esc(m.nom) + '</h2><p class="gris" style="margin:0 0 6px">'
    + esc(nomClasse + " · " + cle) + " · " + m.parties.map(p => esc(p[0]) + " /" + esc(texteNote(p[1]))).join(" + ") + "</p>"
    + '<p class="gris">Tapez la note, ou <b>NC</b> si l\'élève n\'a pas composé (compté 0). Virgule acceptée (12,5).'
    + " Touchez d'abord « Modifier ».</p>"
    + (suiv >= 0 ? '<button class="gros contour" id="b-suivante">Suivante : ' + esc(ms[suiv].nom) + " ›</button>" : "") + "</div>";
  els.forEach((el, k) => {
    const v = (compo.notes[el.id] || {})[m.nom] || [];
    html += '<div class="eleve"><div class="nom"><span class="num">' + String(k + 1).padStart(2, "0") + ".</span> " + esc(el.prenom) + " "
         + esc(String(el.nom || "").toUpperCase()) + '</div><div class="parties">';
    m.parties.forEach((p, j) => html += '<div class="partie"><label>' + esc(p[0]) + " /" + esc(texteNote(p[1])) + "</label>"
         + '<input type="text" inputmode="decimal" autocomplete="off" data-e="' + k + '" data-p="' + j + '" value="' + esc(v[j] !== undefined ? texteNote(v[j]) : "") + '" disabled></div>');
    html += "</div></div>";
  });
  if (!els.length) html += '<div class="carte"><p>Aucun élève dans cette classe.</p></div>';
  const barre = '<button class="gros" id="b-modifier">Modifier</button>'
              + '<button class="gros vert cache" id="b-enreg">Enregistrer</button><button class="gros contour cache" id="b-annuler">Annuler</button>';
  ecran(m.nom, nomClasse + " · " + cle, html + '<div id="msg"></div>', () => ecranActivites(nomClasse, cle), barre);
  const cases = [...document.querySelectorAll("input[data-e]")];
  let ouvert = false, depart = cases.map(c => c.value);
  avantDeQuitter = () => ouvert && cases.some((c, k) => c.value !== depart[k]);
  const ouvrir = oui => {
    ouvert = oui; cases.forEach(c => { c.disabled = !oui; c.classList.remove("faux"); });

    cases.forEach(c => c.classList.remove("faux")); $("barre-msg").innerHTML = "";

        return erreur(nomEl + " : s'il n'a pas composé, tapez « NC » dans toutes les cases de l'activité.", cases.find(x => +x.dataset.e === k));

      + (suiv >= 0 ? " Pour continuer : « Suivante : " + esc(ms[suiv].nom) + " »." : "") + "</div>");
  };

/* ---------- 12. Étape 305 : MA RÉPARTITION et MES FICHES (le maître les fait sur son téléphone) ----------
   Le contenu (guide, répartitions, fiches toutes prêtes du CE1 au CM2) est rangé dans l'application, chiffré :
   la clé arrive dans le fichier de la classe. Ce que le maître change reste dans le téléphone (M.pedago).
   Le soir, il coche des fiches et les envoie au directeur en PDF (WhatsApp). */
const NIVEAUX_FICHES = ["CE1", "CE2", "CM1", "CM2"];
const JOURS_SEM = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
const ORDINAUX = ["Première", "Deuxième", "Troisième", "Quatrième", "Cinquième", "Sixième", "Septième", "Huitième", "Neuvième", "Dixième"];
const CONTENUS = {};
const SEL = new Set();                 // fiches cochées : "classe|semaine|activité|i"
let EP = null;                         // écran pédagogique en cours de modification
const niveauDe = n => String(n || "").split(" ")[0];
const pad2 = x => String(x).padStart(2, "0");
const cleR = s => "R" + pad2(Math.ceil(s / 4));
const clone = v => JSON.parse(JSON.stringify(v));
const classesFiches = () => nomsClasses().filter(n => NIVEAUX_FICHES.includes(niveauDe(n)));
const infoTel = () => (S && S.donnees && S.donnees.contenu_tel) || null;

async function contenuNiveau(niv) {
  if (CONTENUS[niv]) return CONTENUS[niv];
  const info = infoTel();
  if (!info || !info.cle) throw new Error("cle");
  const rep = await fetch("contenu_" + niv + ".bin");
  if (!rep.ok) throw new Error("fichier");
  const o = new Uint8Array(await rep.arrayBuffer());
  const cle = await crypto.subtle.importKey("raw", b64enOctets(String(info.cle)), "AES-GCM", false, ["decrypt"]);
  const brut = await crypto.subtle.decrypt({name: "AES-GCM", iv: o.slice(5, 17)}, cle, o.slice(17));
  const C = JSON.parse(dec.decode(brut));
  C.pasFiche = new Set(C.pas_de_fiche);
  C.parLecon = {};
  for (const [k, f] of Object.entries(C.fiches)) { const c = k.split("|")[1] + "|" + f.lecon; if (!C.parLecon[c]) C.parLecon[c] = k; }
  return (CONTENUS[niv] = C);
}
// Charge le contenu, ou explique pourquoi c'est impossible ; puis appelle suite(C)
async function avecContenu(n, retour, suite) {
  if (!NIVEAUX_FICHES.includes(niveauDe(n)))
    return ecran("Pédagogie", n, '<div class="message info">Les répartitions et les fiches toutes prêtes existent du CE1 au CM2. '
      + "Elles n'existent pas encore pour le " + esc(niveauDe(n)) + ".</div>", retour);
  if (!infoTel())
    return ecran("Pédagogie", n, '<div class="message info"><b>Il manque une mise à jour de votre classe.</b><br>'
      + "Demandez au directeur de vous renvoyer le fichier de votre classe (depuis la nouvelle version du logiciel de l'ordinateur), "
      + "puis touchez « Importer une mise à jour de ma classe ».</div>"
      + '<button class="gros contour" id="b-maj2">📥 Importer une mise à jour de ma classe</button>', retour);
  attente(true, "Ouverture des fiches…");
  let C = null;
  try { C = await contenuNiveau(niveauDe(n)); } catch (e) { C = null; }
  attente(false);
  if (!C) return ecran("Pédagogie", n, '<div class="message erreur">Les fiches n\'ont pas pu être ouvertes. '
    + "Mettez l'application à jour, ou demandez au directeur de vous renvoyer votre classe.</div>", retour);
  return suite(C);
}

/* --- ce que le maître a changé, gardé dans le téléphone (par année, école et classe) --- */
function pedago(n) {
  M.pedago = M.pedago || {};
  const k = anneeScolaire() + "|" + (S.donnees.nom_ecole || "") + "|" + n;
  const p = (M.pedago[k] = M.pedago[k] || {});
  p.reps = p.reps || {}; p.fiches = p.fiches || {}; p.envois = p.envois || {};
  return p;
}
// La répartition R : celle du téléphone, sinon celle faite sur l'ordinateur, sinon null (= le guide)
function repartitionTel(n, R) {
  const p = pedago(n);
  if (p.reps[R]) return p.reps[R];
  const o = ((S.donnees.classes[n] || {}).repartitions || {})[R];
  if (o && (Object.keys(o.contenus || {}).length || (o.semaines || []).some(x => x && x[0])))
    return {semaines: clone(o.semaines || []), contenus: clone(o.contenus || {}), ordinateur: true};
  return null;
}
function texteGuide(C, act, s) { return ((C.guide[act] || [])[s - 1]) || ""; }
function texteCase(n, C, act, s) {          // ce qui est écrit dans la case (répartition, sinon guide)
  const rep = repartitionTel(n, cleR(s)), k = (s - 1) % 4;
  const t = rep && rep.contenus && rep.contenus[act] ? String(rep.contenus[act][k] || "").trim() : "";
  return t || texteGuide(C, act, s);
}
function leconsTextes(n, C, s, act) {        // comme fiche_lecons_semaine de l'ordinateur
  const rep = repartitionTel(n, cleR(s)), k = (s - 1) % 4;
  const t = rep && rep.contenus && rep.contenus[act] ? String(rep.contenus[act][k] || "").trim() : "";
  let morceaux;
  if (t && t !== texteGuide(C, act, s)) morceaux = t.split(/\n| ; | · /).map(m => m.replace(/^S\d+\s*/, "").trim());
  else { const g = (C.guide_brut[act] || [])[s - 1]; morceaux = Array.isArray(g) ? g.slice() : [g || ""]; }
  return morceaux.filter(m => m && String(m).trim());
}
function pasUneLecon(texte) {
  const t = String(texte || "").trim().toLowerCase();
  return !t || /^(intégration|évaluation|révision|semaine d'intégration|préparation|remédiation|composition)/.test(t)
    || t.includes("intégration interdisciplinaire");
}
function joursActivite(n, C, act) {
  const j = ((infoTel() || {}).jours || {})[n];
  return (j && j[act]) || C.jours[act] || [];
}
function fichesSemaine(n, C, s) {
  const presentes = new Set(C.domaines.flatMap(d => d[1])), lecons = [], sans = [];
  for (const act of C.activites_fiches) {
    if (!presentes.has(act)) continue;
    const textes = leconsTextes(n, C, s, act), vraies = textes.filter(t => !pasUneLecon(t));
    if ((textes.length && !vraies.length) || (vraies.length && C.pasFiche.has(s + "|" + act))) { sans.push([act, textes[0] || ""]); continue; }
    const jours = joursActivite(n, C, act);
    vraies.forEach((t, i) => lecons.push({act, i, lecon: t, jour: jours.length ? jours[Math.min(i, jours.length - 1)] : ""}));
  }
  const rang = j => { const k = JOURS_SEM.indexOf(j); return k < 0 ? 9 : k; };
  lecons.sort((a, b) => rang(a.jour) - rang(b.jour) || C.activites_fiches.indexOf(a.act) - C.activites_fiches.indexOf(b.act) || a.i - b.i);
  return {lecons, sans};
}

/* --- les dates : les semaines de la répartition, sinon le calendrier de l'école --- */
const enDate = t => dateValable(String(t || "").trim());
const texteDate = d => pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear();
const lundiDe = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
function semainesCalendrier(n) {
  let l = ((infoTel() || {}).semaines_cours || []).map(x => [String(x[0]), String(x[1])]);
  if (!l.length) {                            // pas de calendrier : lundi-vendredi depuis le 1er lundi d'octobre
    const y = +anneeScolaire().slice(0, 4); let d = lundiDe(new Date(y, 9, 7));
    for (let k = 0; k < 40; k++) { const v = new Date(d); v.setDate(v.getDate() + 4); l.push([texteDate(d), texteDate(v)]); d.setDate(d.getDate() + 7); }
  }
  const debut = enDate((S.donnees.classes[n] || {}).debut_cours);
  if (debut) { const k = l.findIndex(x => { const a = enDate(x[1]); return a && a >= debut; }); if (k > 0) l = l.slice(k); }
  return l;
}
function datesSemaine(n, s) {                // [du, au] de la semaine s (textes), ou ["", ""]
  const propre = s2 => { const rep = repartitionTel(n, cleR(s2)), w = rep && rep.semaines && rep.semaines[(s2 - 1) % 4];
                         return w && w[0] ? [String(w[0]), String(w[1] || "")] : null; };
  const ici = propre(s); if (ici) return ici;
  const cal = semainesCalendrier(n);
  for (let s2 = s - 1; s2 >= 1; s2--) {       // la dernière semaine connue avant, puis les semaines de cours qui suivent
    const w = propre(s2); if (!w) continue;
    const k = cal.findIndex(x => x[0] === w[0] || (enDate(x[0]) && enDate(w[0]) && lundiDe(enDate(x[0])).getTime() === lundiDe(enDate(w[0])).getTime()));
    if (k >= 0 && cal[k + s - s2]) return cal[k + s - s2];
    break;
  }
  return cal[s - 1] || ["", ""];
}
function dateDuJour(n, s, jour) {
  const du = enDate(datesSemaine(n, s)[0]); if (!du) return null;
  const d = lundiDe(du), k = JOURS_SEM.indexOf(jour);
  if (k >= 0) d.setDate(d.getDate() + k); else return du;
  return d;
}
function nbSemaines(C) { return C.nb_rep * 4; }
function semaineDuJour(n, C) {
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  if (auj.getDay() === 0 || auj.getDay() === 6) auj.setDate(auj.getDate() + (auj.getDay() === 6 ? 2 : 1));
  let choix = 1;
  for (let s = 1; s <= nbSemaines(C); s++) { const d = enDate(datesSemaine(n, s)[0]); if (d && lundiDe(d) <= auj) choix = s; }
  return choix;
}
function demain() {                           // le prochain jour de classe (le vendredi : lundi)
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d;
}
const nomJour = d => JOURS_SEM[(d.getDay() + 6) % 7] || "";

/* --- une fiche : celle modifiée par le maître, sinon la fiche toute prête, sinon une fiche à compléter --- */
function ficheVide(n, C, l) {
  return {champs: {cours: n, fiche: "", activite: l.act, date: "", duree: "", cb: "", palier: "", oa: "", contenu: l.lecon, os: "",
                   moyens_ped: "", moyens_mat: "", doc: "Guide pédagogique " + C.etape + " (CEB), cahier de l'élève"},
          etapes: [["Séance 1 — Révision", "", ""], ["Phase d'appropriation", "", ""], ["Phase d'évaluation", "", ""]]};
}
function ficheDe(n, C, s, l) {
  const cle = s + "|" + l.act + "|" + l.i, m = pedago(n).fiches[cle];
  let f, etat;
  if (m && m.lecon === l.lecon) { f = clone(m); etat = "Modifiée"; }
  else {
    let g = C.fiches[cle];
    if (!g || g.lecon !== l.lecon) g = C.fiches[C.parLecon[l.act + "|" + l.lecon]] || null;
    if (g) { f = clone(g); etat = g.incomplete ? "À compléter" : "Prête"; }
    else { f = ficheVide(n, C, l); etat = "À compléter"; }
  }
  const d = dateDuJour(n, s, l.jour);
  f.champs.cours = n; f.champs.date = d ? texteDate(d) : "……/……/………"; f.champs.contenu = f.champs.contenu || l.lecon;
  return {f, etat, cle, d};
}
const couleurEtat = e => e === "Prête" ? "var(--vert)" : e === "Modifiée" ? "#1A3E8C" : "#B26A00";

/* --- les onglets des classes (classe multigrade : CE1 + CE2) --- */
function ongletsClasses(n, aller) {

function premiereClasseFiches() { return classesFiches()[0] || nomsClasses()[0]; }

/* ===================== 📅 MA RÉPARTITION ===================== */
function ecranRepartition(n, R, message) {
  n = n || premiereClasseFiches();
  avecContenu(n, ecranClasse, C => {
    const nb = C.nb_rep; R = R || cleR(semaineDuJour(n, C));
    const num = +R.slice(1), p = pedago(n), rep = repartitionTel(n, R);
    const ouvert = EP && EP.type === "rep" && EP.n === n && EP.R === R;
    let html = (message || "") + ongletsClasses(n);
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
    for (let r = 1; r <= nb; r++) {
      const c = "R" + pad2(r), faite = !!(p.reps[c] || (repartitionTel(n, c) || {}).ordinateur);
      html += '<button data-r="' + c + '" style="flex:1 0 54px;font-size:16px;font-weight:bold;padding:9px 4px;border-radius:9px;border:2px solid '
        + (c === R ? "var(--rouge);background:var(--rouge);color:white" : "#CCC;background:white;color:" + (faite ? "var(--vert)" : "#555")) + '">'
        + (r === 1 ? "1re" : r + "e") + (faite ? " ✓" : "") + "</button>";
    }

    html += '<div class="carte"><h2>' + ORDINAUX[num - 1] + " répartition</h2><p class='gris'>Semaines " + s0 + " à " + (s0 + 3) + " du guide · "
      + (p.reps[R] ? "<b style='color:#1A3E8C'>modifiée sur ce téléphone</b>" : rep && rep.ordinateur ? "faite sur l'ordinateur" : "celle du guide pédagogique") + "</p>";
    for (let k = 0; k < 4; k++) {
      const [du, au] = datesSemaine(n, s0 + k);
      html += ouvert
        ? '<div class="deux" style="align-items:center;margin-top:6px"><div style="flex:0 0 74px;font-weight:bold">Sem. ' + (k + 1) + '</div><div><input type="text" inputmode="numeric" data-du="' + k + '" value="' + esc(EP.v.semaines[k][0]) + '" placeholder="du"></div><div><input type="text" inputmode="numeric" data-au="' + k + '" value="' + esc(EP.v.semaines[k][1]) + '" placeholder="au"></div></div>'
        : "<p style='margin:3px 0'><b>Semaine " + (k + 1) + "</b> : " + (du ? "du " + esc(du) + (au ? " au " + esc(au) : "") : "<span class='gris'>dates pas encore fixées</span>") + "</p>";
    }

    html += "</div>";
    for (const [dom, acts] of C.domaines) {
      if (!acts.length) continue;
      html += '<h2 style="color:var(--rouge);margin:16px 0 8px">' + esc(dom) + "</h2>";
      for (const act of acts) {
        html += '<div class="carte" style="padding:12px 14px"><b>' + esc(act) + "</b>";
        for (let k = 0; k < 4; k++) {
          const s = s0 + k, t = ouvert ? EP.v.contenus[act][k] : texteCase(n, C, act, s);
          html += ouvert
            ? '<label class="gris" style="display:block;margin-top:8px">Semaine ' + (k + 1) + '</label><textarea rows="2" data-act="' + esc(act) + '" data-k="' + k + '" style="font-size:16px">' + esc(t) + "</textarea>"
            : '<p style="margin:6px 0 0;font-size:16px"><span class="gris">S' + (k + 1) + " :</span> " + (t ? esc(t).replace(/\n/g, "<br>") : "<span class='gris'>—</span>") + "</p>";
        }
        html += "</div>";
      }
    }
    if (!ouvert && p.reps[R]) html += '<button class="gros contour" id="b-guide">↺ Revenir à la répartition ' + (rep && rep.ordinateur ? "" : "du guide") + "</button>";
    const barre = ouvert ? '<button class="gros vert" id="b-enreg">Enregistrer</button><button class="gros contour" id="b-annuler">Annuler</button>'
                         : '<button class="gros" id="b-modifier">Modifier</button>';
    ecran("Ma répartition", n + " · " + ORDINAUX[num - 1].toLowerCase() + " répartition", html, () => { EP = null; ecranClasse(); }, barre);

        for (const [, acts] of C.domaines) for (const act of acts) v.contenus[act] = [0, 1, 2, 3].map(k => texteCase(n, C, act, s0 + k));
        EP = {type: "rep", n, R, v, depart: JSON.stringify(v)};

}
function messageBarre(t) { $("barre-msg").innerHTML = '<div class="message erreur" style="margin:0 0 8px">' + esc(t) + "</div>"; }
function formaterDate(v) {                    // 06102026 -> 06/10/2026 pendant la frappe

/* ===================== 📘 MES FICHES (maquette 2 : toute la semaine sur une liste) ===================== */
function ecranFiches(n, s, message) {
  n = n || premiereClasseFiches();
  avecContenu(n, ecranClasse, C => {
    const nb = nbSemaines(C);
    s = Math.min(Math.max(s || semaineDuJour(n, C), 1), nb);
    const {lecons, sans} = fichesSemaine(n, C, s), p = pedago(n);
    const [du, au] = datesSemaine(n, s), dem = demain(), nomDem = nomJour(dem);
    const deDemain = lecons.filter(l => { const d = dateDuJour(n, s, l.jour); return d && d.getTime() === dem.getTime(); });
    let html = (message || "") + ongletsClasses(n);
    html += '<div class="deux" style="margin-bottom:8px"><div><button class="gros contour" id="b-sp" style="margin:0;font-size:15px;padding:10px"' + (s <= 1 ? " disabled" : "")
      + '>‹ Semaine ' + (s - 1) + '</button></div><div><button class="gros contour" id="b-ss" style="margin:0;font-size:15px;padding:10px"' + (s >= nb ? " disabled" : "")
      + ">Semaine " + (s + 1) + " ›</button></div></div>";
    html += '<p class="gris" style="text-align:center;margin:0 0 6px">' + (du ? "Du " + esc(du) + (au ? " au " + esc(au) : "") : "Dates pas encore fixées (voir « Ma répartition »)") + "</p>";
    if (deDemain.length) html += '<button class="gros contour" id="b-demain" style="font-size:16px;padding:11px">☑ Cocher les fiches de demain (' + nomDem.toLowerCase() + " " + pad2(dem.getDate()) + "/" + pad2(dem.getMonth() + 1) + ")</button>";
    let jourCourant = null;
    for (const l of lecons) {
      if (l.jour !== jourCourant) {
        jourCourant = l.jour; const d = dateDuJour(n, s, l.jour);
        html += '<h2 style="color:var(--rouge);margin:16px 0 8px">' + esc(l.jour || "Jour à fixer") + (d ? " " + pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) : "") + "</h2>";
      }
      const {etat, cle} = ficheDe(n, C, s, l), id = n + "|" + cle, on = SEL.has(id);
      html += '<div class="carte" style="display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:8px">'
        + '<button data-coche="' + esc(id) + '" aria-label="Cocher" style="flex:none;width:34px;height:34px;border-radius:8px;font-size:20px;font-weight:bold;border:2px solid '
        + (on ? "var(--vert);background:var(--vert);color:white" : "#999;background:white;color:white") + '">' + (on ? "✓" : "") + "</button>"
        + '<button data-ouvre="' + esc(cle) + '" style="flex:1;text-align:left;background:none;border:0;padding:0;color:var(--texte)"><b style="font-size:16px">' + esc(l.act) + "</b><br><span style='font-size:15px'>" + esc(l.lecon)
        + "</span><br><span style='font-size:13px;font-weight:bold;color:" + couleurEtat(etat) + "'>" + etat + "</span>"
        + (p.envois[cle] ? "<span style='font-size:13px;color:var(--gris)'> · envoyée le " + new Date(p.envois[cle]).toLocaleDateString("fr-FR") + " ✓</span>" : "") + "</button></div>";
    }
    if (!lecons.length) html += '<div class="message info">Pas de fiche cette semaine.</div>';
    if (sans.length) html += '<div class="carte"><b>Sans fiche cette semaine</b>' + sans.map(([a, t]) => "<p class='gris' style='margin:4px 0'>" + esc(a) + " : " + esc(t || "—") + "</p>").join("") + "</div>";
    const nbCoches = [...SEL].length;
    ecran("Mes fiches", n + " · semaine " + s, html, ecranClasse,
      '<button class="gros vert" id="b-envoyer-fiches"' + (nbCoches ? "" : " disabled") + ">📤 Envoyer " + (nbCoches ? "les " + nbCoches + " fiche" + (nbCoches > 1 ? "s" : "") + " cochée" + (nbCoches > 1 ? "s" : "") : "les fiches cochées") + " (PDF)</button>");
    brancherOnglets(c => ecranFiches(c));
    if ($("b-sp")) $("b-sp").onclick = () => ecranFiches(n, s - 1);
    if ($("b-ss")) $("b-ss").onclick = () => ecranFiches(n, s + 1);
    if ($("b-demain")) $("b-demain").onclick = () => { deDemain.forEach(l => SEL.add(n + "|" + s + "|" + l.act + "|" + l.i)); ecranFiches(n, s); };
    document.querySelectorAll("[data-coche]").forEach(b => b.onclick = () => { const id = b.dataset.coche; SEL.has(id) ? SEL.delete(id) : SEL.add(id); ecranFiches(n, s); });

    $("b-envoyer-fiches").onclick = () => envoyerFiches(() => ecranFiches(n, s));
  });
}

/* --- une fiche ouverte : lisible en grand ; « Modifier » pour la changer --- */
const CHAMPS_FICHE = [["duree", "Durée"], ["cb", "CB"], ["palier", "Palier"], ["oa", "OA"], ["contenu", "Contenu"], ["os", "OS"],

    });
    if (ouvert) html += '<button class="gros contour" id="b-ajout-etape">➕ Ajouter une étape</button>';

      html += '<div class="carte"><b>Fiche de critères</b>' + v.encadres.criteres.map(c => "<p style='margin:4px 0'>☐ " + esc(c) + "</p>").join("") + "</div>";
    if (!ouvert && etat === "Modifiée") html += '<button class="gros contour" id="b-reprendre">↺ Reprendre la fiche toute prête du logiciel</button>';

      : '<button class="gros contour" id="b-modifier">Modifier</button><button class="gros' + (on ? " vert" : "") + '" id="b-cocher">' + (on ? "✓ À envoyer" : "☑ À envoyer") + "</button>";
    ecran("Fiche", n + " · " + (l.jour || "") + " " + f.champs.date, html, () => { EP = null; ecranFiches(n, s); }, barre);

      $("b-ajout-etape").onclick = () => { lire(); EP.v.etapes.push(["", "", ""]); ecranFicheTel(n, s, act, i); };

        if (!peutTaper()) return alerte(texteLicence());
        const v2 = clone(f); v2.etapes = (v2.etapes || []).map(e => [String(e[0] || ""), String(e[1] || ""), String(e[2] || "")]);
        EP = {type: "fiche", id, v: v2, depart: JSON.stringify(v2)};
        ecranFicheTel(n, s, act, i);
      };
      $("b-cocher").onclick = () => { SEL.has(id) ? SEL.delete(id) : SEL.add(id); ecranFicheTel(n, s, act, i); };
      if ($("b-reprendre")) $("b-reprendre").onclick = () => {
        if (!confirm("Effacer vos changements et reprendre la fiche toute prête du logiciel ?")) return;
        delete p.fiches[cle]; garderMemoire(); ecranFicheTel(n, s, act, i, '<div class="message ok">✓ Fiche du logiciel reprise.</div>');
      };
    }
  });
}

function bandeauFicheHtml(n) {
  const d = S.donnees, ens = (d.classes[n] || {}).enseignant || {};
  const autres = [d.ia ? "Inspection d'Académie : " + esc(d.ia) : "", d.ief ? "IEF : " + esc(d.ief) : ""].filter(x => x);
  const maitre = ((ens.prenom || "") + " " + (ens.nom || "")).trim();
  return '<div class="haut">' + ICONE_ECOLE + '<div class="gauche"><div class="ec">' + esc(d.nom_ecole || "") + '</div><div class="petit">' + autres.join(" · ")

    + (ens.sexe === "F" ? "Enseignante : " : "Enseignant : ") + "<b>" + esc(maitre || "……………") + "</b></div></div>";
}
function ficheA4Html(n, f) {                  // comme page_fiche_prep_html de l'ordinateur (fiche 1 : tout en tableau)

  const lignes = [["CB", c.cb], ["Palier", c.palier], ["OA", c.oa], ["Contenu", c.contenu], ["OS", c.os], ["Moyens pédagogiques", c.moyens_ped],

  let s = "<div class='fiche'>" + bandeauFicheHtml(n) + "<table class='tete'><tr><td style='width:27%'>Cours : <b>" + t(c.cours) + "</b><br>Fiche n° : <b>" + t(c.fiche)
    + "</b></td><td class='titre'>" + t(c.activite).toUpperCase() + "</td><td style='width:27%'>Date : <b>" + t(c.date) + "</b><br>Durée : <b>" + t(c.duree)
    + "</b></td></tr></table><table class='info'>";
  for (const [nom, v] of lignes) s += "<tr><td class='lab'>" + nom + "</td><td" + (nom === "Contenu" ? " class='gras'" : "") + ">" + t(v) + "</td></tr>";
  s += "</table><div class='dem'>Démarche</div><table class='etapes'><tr><th style='width:20%'>ÉTAPES</th><th>ACTIVITÉS DU MAÎTRE</th><th style='width:27%'>ACTIVITÉS DES ÉLÈVES</th></tr>";
  for (const [e, m0, el] of (f.etapes || [])) {
    const m = String(m0 || "");
    if (String(e).startsWith("Séance 2")) {
      s += "<tr><td colspan='3' class='sea'>Séance 2</td></tr><tr><td class='et'>" + t(String(e).split("—").slice(1).join("—").trim() || e) + "</td><td>" + t(m) + "</td><td>" + t(el) + "</td></tr>";
      continue;
    }
    let mh = t(m);
    if (m.startsWith("S1 — ") && m.includes("\nS2 — ")) {
      const [g, d] = [m.slice(0, m.indexOf("\nS2 — ")), m.slice(m.indexOf("\nS2 — ") + 6)];
      mh = "<table class='s12'><tr><td><b>S1</b> — " + t(g.slice(5)) + "</td><td><b>S2</b> — " + t(d) + "</td></tr></table>";
    }
    s += "<tr><td class='et'>" + t(e) + "</td><td>" + mh + "</td><td>" + t(el) + "</td></tr>";

    for (const cr of enc.criteres || []) s += "<tr><td>" + t(cr) + "</td><td></td><td></td></tr>";

// Dans le PDF du téléphone, une page A4 = 794 × 1123 points d'écran : on pousse à la page suivante ce qui serait coupé.
const SCRIPT_PAGES = "<scr" + `ipt>
function paginerPourPdf() {
  var H = 1123, MARGE = 38, haut = function (el) { return el.getBoundingClientRect().top + window.scrollY; };
  var blocs = document.querySelectorAll(".fiche, .haut, table.tete, table.info tr, .dem, table.etapes tr, table.enc, .gr");
  for (var k = 0; k < blocs.length; k++) {
    var el = blocs[k], t = haut(el), b = t + el.getBoundingClientRect().height, p = Math.floor(t / H);
    var debut = p * H + MARGE, fin = (p + 1) * H - MARGE;
    var pousser = el.classList.contains("fiche") ? (k > 0 && t > debut + 2) : (b > fin && t > debut + 2);
    if (!pousser) continue;
    var manque = (p + 1) * H + MARGE - t;
    if (el.tagName === "TR") {
      var tr = document.createElement("tr"); tr.className = "saut";
      tr.innerHTML = '<td colspan="3" style="height:' + manque + 'px"></td>'; el.parentNode.insertBefore(tr, el);
    } else {
      var sp = document.createElement("div"); sp.style.height = manque + "px"; el.parentNode.insertBefore(sp, el);
    }
  }
  var pages = Math.max(1, Math.ceil((document.body.scrollHeight - 2) / H));
  document.body.style.minHeight = (pages * H) + "px";
  return pages;
}
<\/script>`;
function pageFichesHtml(liste, donnees, pourPdf) {
  return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=794"><title>Fiches de préparation</title>' + STYLE_FICHES
    + (pourPdf ? SCRIPT_PAGES : "") + "</head><body" + (pourPdf ? ' class="pdf"' : "") + ">" + liste.map(x => ficheA4Html(x.n, x.f)).join("")
    + (donnees ? "<!" + "--\n%DSOB-FICHES " + donnees + "\n--" + ">" : "") + "</body></html>";
}
function octetsUtf8EnB64(texte) { return octetsEnB64(enc.encode(texte)); }
async function envoyerFiches(retour) {
  if (LIC.statut !== "valide")
    return alerte("L'envoi des fiches en PDF est réservé aux écoles qui ont leur licence de l'année.\n\n" + texteLicence());
  const ids = [...SEL]; if (!ids.length) return;
  if (ids.length > 30) return alerte("Vous avez coché " + ids.length + " fiches. Envoyez-en 30 au plus à la fois (par exemple, celles de demain).");
  attente(true, "Préparation du PDF…");
  const liste = [];
  try {
    for (const id of ids) {
      const [n, s, act, i] = id.split("|");
      const C = await contenuNiveau(niveauDe(n));
      const l = fichesSemaine(n, C, +s).lecons.find(x => x.act === act && x.i === +i);
      if (!l) continue;
      const r = ficheDe(n, C, +s, l);
      liste.push({n, s: +s, l, f: r.f, etat: r.etat, cle: r.cle, d: r.d});
    }
  } catch (e) { attente(false); return alerte("Les fiches n'ont pas pu être préparées."); }
  attente(false);
  if (!liste.length) { SEL.clear(); return retour(); }
  liste.sort((a, b) => (a.d ? a.d.getTime() : 0) - (b.d ? b.d.getTime() : 0) || a.n.localeCompare(b.n));
  const ens = (S.donnees.classes[liste[0].n] || {}).enseignant || {};
  const donnees = {format: "GestionEcole-fiches-1", ecole: S.donnees.nom_ecole || "", annee: anneeScolaire(), code: S.code.slice(0, 3),
    maitre: ((ens.prenom || "") + " " + (ens.nom || "")).trim(), classes: [...new Set(liste.map(x => x.n))], envoye_le: new Date().toISOString(),
    fiches: liste.map(x => ({classe: x.n, semaine: x.s, activite: x.l.act, i: x.l.i, lecon: x.l.lecon, jour: x.l.jour,
                             date: x.d ? texteDate(x.d) : "", etat: x.etat, fiche: {champs: x.f.champs, etapes: x.f.etapes, encadres: x.f.encadres || null, grille_eleve: x.f.grille_eleve || null}}))};
  const b64 = octetsUtf8EnB64(JSON.stringify(donnees));
  const dates = [...new Set(liste.map(x => x.d ? texteDate(x.d) : ""))];
  const quand = dates.length === 1 && dates[0] ? (nomJour(liste[0].d) + "_" + dates[0].replace(/\//g, "-")) : "semaine_" + liste[0].s;
  const nom = "Fiches_" + sansAccents(donnees.classes.join("_")) + "_" + sansAccents(quand);
  const noter = () => {
    for (const x of liste) pedago(x.n).envois[x.cle] = Date.now();
    garderMemoire(); SEL.clear();
  };
  window.pdfEchec = async () => {               // le téléphone n'a pas pu faire le PDF : on envoie la page (même contenu)
    const r = await partagerFichier(nom + ".html", pageFichesHtml(liste, b64, false));
    if (r !== "annule") { noter(); retour(); }
  };
  if (window.Android && Android.fairePdf) {
    try { Android.fairePdf(nom + ".pdf", pageFichesHtml(liste, null, true), b64); noter(); return retour(); }
    catch (e) { /* ancienne version de l'application : la page */ }
  }
  return window.pdfEchec();
}
